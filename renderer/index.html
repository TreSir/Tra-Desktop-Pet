<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="pet"></canvas>
  <script src="canvas-ui.js"></script>
  <script>
    // 同步加载统一配置文件（file:// 协议下同步 XHR 可用）
    (function() {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '../game_config.json', false);
        xhr.send();
        window.GAME_CONFIG = JSON.parse(xhr.responseText);
        console.log('[CONFIG] game_config.json loaded');
      } catch (e) {
        console.warn('[CONFIG] load failed:', e.message);
        window.GAME_CONFIG = { characters: {}, shop: { food: [], emotion: [], effect: [] } };
      }
    })();
  </script>
  <script src="characters.js"></script>
  <script src="effects.js"></script>
  <script src="app.js"></script>
</body>
</html>

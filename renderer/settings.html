<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>偏好设置 · Companion Studio</title>
<link rel="stylesheet" href="ui.css"><script defer src="ui-common.js"></script><script defer src="settings.js"></script>
</head>
<body data-theme="aurora">
<div class="shell">
  <header class="titlebar"><span class="brand-mark" aria-hidden="true">✳</span><span class="brand-name">COMPANION</span><span class="title-context">偏好设置</span><span class="grow"></span><button class="icon-btn close" id="closeBtn" aria-label="关闭设置" title="关闭 · Esc">×</button></header>
  <main class="main-scroll settings-content">
    <div class="page-heading"><div><div class="eyebrow">MAKE YOURSELF AT HOME</div><h1>让陪伴，刚刚好。</h1><p class="subtext">从桌面的颜色，到它散步的节奏。</p></div><img class="mini-art" src="assets/cat-honey.png" alt="奶油金小猫"></div>
    <div id="loadError" class="notice" hidden>设置加载失败。<button class="button" id="retryBtn">重新加载</button></div>
    <fieldset id="settingsFields" disabled style="border:0;padding:0;margin:0;min-width:0">
      <section aria-labelledby="presetTitle">
        <div class="section-head"><h2 id="presetTitle">选择今天的陪伴节奏</h2><span class="count" id="presetStatus">也可以自由微调</span></div>
        <div class="preset-grid" id="presetGrid"></div>
      </section>
      <section aria-labelledby="appearanceTitle">
        <div class="section-head"><h2 id="appearanceTitle">01 / 界面风格</h2><span class="count">随心切换，即刻应用</span></div>
        <div class="themes">
          <button class="theme-card" data-theme-choice="aurora" aria-pressed="true"><span class="theme-preview" style="--sample:#10171c;--sample-accent:#b9efcf"></span><strong>极光 · 夜色</strong><small>深色 / 柔和薄荷</small></button>
          <button class="theme-card" data-theme-choice="sweet" aria-pressed="false"><span class="theme-preview" style="--sample:#eee2d1;--sample-accent:#85533d"></span><strong>甜暖 · 奶油</strong><small>浅色 / 焦糖暖光</small></button>
          <button class="theme-card" data-theme-choice="pixel" aria-pressed="false"><span class="theme-preview" style="--sample:#211f36;--sample-accent:#d3ef8c"></span><strong>像素 · 游乐场</strong><small>复古 / 青柠紫调</small></button>
        </div>
      </section>
      <section aria-labelledby="movementTitle">
        <div class="section-head"><h2 id="movementTitle">02 / 它的步调</h2><span class="count">移动与进食</span></div>
        <div class="settings-card" id="movementControls"></div>
      </section>
      <section aria-labelledby="energyTitle">
        <div class="section-head"><h2 id="energyTitle">03 / 休息与活力</h2><span class="count">找到舒适的节奏</span></div>
        <div class="settings-card" id="energyControls"></div>
      </section>
      <section aria-labelledby="interactionTitle">
        <div class="section-head"><h2 id="interactionTitle">04 / 陪伴的小细节</h2><span class="count">交互与动画</span></div>
        <div class="settings-card" id="interactionControls"></div>
      </section>
    </fieldset>
    <div class="section-head"><h2>相处小指南</h2><button class="button" id="openShop">逛逛商店 ↗</button></div>
    <div class="shortcuts"><span class="shortcut"><kbd>单击</kbd>摸摸它</span><span class="shortcut"><kbd>拖动</kbd>带它换个位置</span><span class="shortcut"><kbd>滚轮</kbd>缩放桌宠</span><span class="shortcut"><kbd>右键</kbd>角色、皮肤与更多</span></div>
  </main>
  <footer class="bottom-bar settings-footer"><span id="saveStatus" role="status" aria-live="polite">加载设置中…</span><span>修改后自动保存</span></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body></html>

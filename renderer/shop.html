<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>羁绊商店 · Companion Studio</title>
<link rel="stylesheet" href="ui.css"><script defer src="ui-common.js"></script><script defer src="shop.js"></script>
</head>
<body data-theme="aurora">
<div class="shell">
  <header class="titlebar">
    <span class="brand-mark" aria-hidden="true">✳</span><span class="brand-name">COMPANION</span><span class="title-context">羁绊商店</span>
    <span class="grow"></span><div class="wallet" aria-label="羁绊币余额"><span aria-hidden="true">◈</span><span id="balanceText">—</span><small>羁绊币</small></div>
    <button class="icon-btn close" id="closeBtn" aria-label="关闭商店" title="关闭 · Esc">×</button>
  </header>
  <div class="workspace">
    <nav class="sidebar" aria-label="商品分类">
      <p class="nav-caption">THE LITTLE THINGS</p>
      <button class="nav-button" data-category="all" aria-pressed="true"><span class="nav-icon">✳</span>全部好物</button>
      <button class="nav-button" data-category="food" aria-pressed="false"><span class="nav-icon">◒</span>补给小食</button>
      <button class="nav-button" data-category="emotion" aria-pressed="false"><span class="nav-icon">☺</span>心情表情</button>
      <button class="nav-button" data-category="effect" aria-pressed="false"><span class="nav-icon">✧</span>魔法特效</button>
      <button class="nav-button" data-category="owned" aria-pressed="false"><span class="nav-icon">▧</span>我的收藏</button>
      <span class="grow"></span>
      <div class="nav-tip"><strong>陪伴，自有回响。</strong>摸摸它、陪它玩，<br>把羁绊换成小惊喜。</div>
      <button class="nav-button" id="openSettings"><span class="nav-icon">⚙</span>偏好设置 ↗</button>
    </nav>
    <main class="main-scroll" id="shopScroll">
      <section class="hero" aria-label="商店介绍">
        <div class="hero-orbit" aria-hidden="true"></div>
        <div class="eyebrow">MADE FOR YOUR LITTLE FRIEND</div>
        <h1>给陪伴，<br>一点小惊喜。</h1>
        <p>一份小食，一点魔法。<br>把平凡的桌面，变成它的小世界。</p>
        <img class="hero-art" src="assets/slime-jade.png" alt="翡翠色史莱姆桌宠">
      </section>
      <div class="section-head"><h2 id="categoryTitle">探索全部好物</h2><span class="count" id="itemCount">正在加载…</span></div>
      <div id="loadError" class="notice" hidden><p>商店暂时没连上，稍后再试一下。</p><button class="button" id="retryBtn">重新加载</button></div>
      <div class="grid" id="productGrid" aria-busy="true"></div>
      <div class="notice" id="emptyState" hidden>还没有收藏。解锁表情和特效，让它更有个性。</div>
    </main>
  </div>
  <footer class="bottom-bar"><span class="status-dot"></span><span>每一次互动，都让羁绊多一点</span><span class="grow"></span><span id="collectionCount">收藏 —</span></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body></html>
